services:
  auth-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auth
      POSTGRES_PASSWORD: auth
      POSTGRES_DB: auth_db
    volumes:
      - auth_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auth -d auth_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  catalog-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: catalog
      POSTGRES_PASSWORD: catalog
      POSTGRES_DB: catalog_db
    volumes:
      - catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalog -d catalog_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: order
      POSTGRES_PASSWORD: order
      POSTGRES_DB: order_db
    volumes:
      - order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U order -d order_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  auth-service:
    build: ./services/auth
    environment:
      PORT: 3001
      DATABASE_URL: postgres://auth:auth@auth-db:5432/auth_db
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      JWT_EXPIRES_IN: 24h
    depends_on:
      auth-db:
        condition: service_healthy

  catalog-service:
    build: ./services/catalog
    environment:
      PORT: 3002
      DATABASE_URL: postgres://catalog:catalog@catalog-db:5432/catalog_db
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    depends_on:
      catalog-db:
        condition: service_healthy

  order-service:
    build: ./services/order
    environment:
      PORT: 3003
      DATABASE_URL: postgres://order:order@order-db:5432/order_db
      JWT_SECRET: ${JWT_SECRET:-dev-jwt-secret-change-me}
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      CATALOG_URL: http://catalog-service:3002
    depends_on:
      order-db:
        condition: service_healthy
      catalog-service:
        condition: service_started

  gateway:
    build: ./gateway
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      AUTH_URL: http://auth-service:3001
      CATALOG_URL: http://catalog-service:3002
      ORDER_URL: http://order-service:3003
    depends_on:
      - auth-service
      - catalog-service
      - order-service

  frontend:
    build: ./frontend
    ports:
      - "3000:80"
    depends_on:
      - gateway

volumes:
  auth_data:
  catalog_data:
  order_data:
